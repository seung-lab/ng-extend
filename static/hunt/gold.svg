<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Hunt gold medal">
  <defs>
    <radialGradient id="disc" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.45" stop-color="#f5d142"/>
      <stop offset="1" stop-color="#a87f12"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.5" stop-color="#a87f12"/>
      <stop offset="1" stop-color="#f5d142"/>
    </linearGradient>
    <linearGradient id="ribbonL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7be0"/>
      <stop offset="1" stop-color="#1d4fa8"/>
    </linearGradient>
    <linearGradient id="ribbonR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5ce6"/>
      <stop offset="1" stop-color="#5a33b0"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
  </defs>
  <!-- ribbon -->
  <path d="M84 8 L124 8 L136 112 L104 124 Z" fill="url(#ribbonL)"/>
  <path d="M172 8 L132 8 L120 112 L152 124 Z" fill="url(#ribbonR)"/>
  <path d="M84 8 L124 8 L127 34 L88 34 Z" fill="#ffffff" opacity="0.12"/>
  <!-- medal -->
  <circle cx="128" cy="160" r="84" fill="url(#rim)"/>
  <circle cx="128" cy="160" r="84" fill="none" stroke="#7a5a08" stroke-width="3"/>
  <circle cx="128" cy="160" r="70" fill="url(#disc)"/>
  <circle cx="128" cy="160" r="70" fill="none" stroke="#7a5a08" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="128" cy="160" r="62" fill="none" stroke="#fff4b8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="2 5"/>
  <!-- two branches merging into one -->
  <g fill="none" stroke="#6b4f0a" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
    <path d="M88 118 C 100 132, 112 144, 128 158" stroke-width="9"/>
    <path d="M168 118 C 156 132, 144 144, 128 158" stroke-width="9"/>
    <path d="M128 158 C 128 176, 124 192, 116 208" stroke-width="11"/>
    <path d="M98 128 C 92 124, 86 126, 80 132" stroke-width="5"/>
    <path d="M158 128 C 164 124, 170 126, 176 132" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#fff4b8" stroke-linecap="round" stroke-opacity="0.55">
    <path d="M90 116 C 102 130, 113 142, 127 155" stroke-width="2"/>
    <path d="M166 116 C 154 130, 143 142, 129 155" stroke-width="2"/>
  </g>
  <!-- the gem where they join -->
  <g transform="translate(128 158)">
    <path d="M-15 -9 L-7 -18 L7 -18 L15 -9 L0 15 Z" fill="url(#gem)" stroke="#0b2a52" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-15 -9 L15 -9 M-7 -18 L-4 -9 L0 15 L4 -9 L7 -18" fill="none" stroke="#0b2a52" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M-9 -15 L-5 -10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- shine -->
  <path d="M80 120 A 62 62 0 0 1 150 102" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
</svg>
