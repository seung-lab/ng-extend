name: Clean Up Old Screenshots

# Keeps player screenshot storage small (Ames 2026-10-07).
#   cleanup:    deletes player screenshots older than 14 days that nothing
#               still needs (scripts/cleanup-screenshots.mjs has the rules).
#               Runs every day; a run by hand only prints unless "delete" is ticked.
#   recompress: a one-off, by hand only: rewrites screenshots stored before the
#               app compressed them itself (scripts/recompress-screenshots.mjs).
on:
  schedule:
    # Every day at 06:20 UTC.
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'What to run.'
        type: choice
        options: [cleanup, recompress]
        default: cleanup
      write:
        description: 'Really change storage. Unticked: print what would happen and change nothing.'
        type: boolean
        default: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      # The scripts live on the game's branch, not the default branch.
      - uses: actions/checkout@v4
        with:
          ref: eyewire-ii-community

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Delete old screenshots nothing needs
        if: github.event_name == 'schedule' || inputs.job == 'cleanup'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DELETE: ${{ (github.event_name == 'schedule' || inputs.write) && '1' || '0' }}
        run: node scripts/cleanup-screenshots.mjs

      - name: Compress screenshots stored before compression
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'recompress'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WRITE: ${{ inputs.write && '1' || '0' }}
        run: |
          mkdir -p /tmp/recompress && cp scripts/recompress-screenshots.mjs /tmp/recompress/
          cd /tmp/recompress && npm init -y >/dev/null && npm install --no-audit --no-fund sharp@0.33 >/dev/null
          node recompress-screenshots.mjs
