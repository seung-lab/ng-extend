name: BuildAndDeployDevBranch
run-name: Deploy ${{ inputs.deployment_id || github.sha }}
on:
  push:
    branches-ignore: [master]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional exact commit to build using this trusted workflow
        type: string
        default: ''
      version:
        description: Target version for an exact-commit build
        type: string
        default: ''
      deployment_id:
        description: Correlation ID for automation
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate dispatch target
        env:
          SOURCE: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$SOURCE" ]; then
            [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$VERSION" =~ ^(eyewire-ii-community|triage-[0-9a-f]{8})$ ]] || exit 1
          elif [ -n "$VERSION" ]; then exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the current production commit for a production dispatch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$VERSION" = eyewire-ii-community ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/eyewire-ii-community)"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Security regression tests
        run: node --test scripts/security-regression.cjs
      - name: Build client bundles
        run: node scripts/build-prod.js
      - name: Record the built commit
        run: git rev-parse HEAD > dist/min/build-commit.txt
      - name: Reject credential material in generated JavaScript
        run: |
          if grep -rlE 'BEGIN (RSA |EC )?PRIVATE KEY|sb_secret_' dist/min --include='*.js'; then
            echo 'Credential material detected in browser output' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ github.sha }}
          path: dist/min/
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: build
    if: github.repository == 'seung-lab/ng-extend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, npm install, repository script or model runs with deploy identity.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-${{ github.sha }}
          path: site/static
      - name: Write fixed static hosting configuration
        shell: bash
        env:
          REF_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION=$(printf '%s' "$REF_NAME" | tr '/_' '--')
          [[ "$VERSION" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || exit 1
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cat > site/app.yaml <<'YAML'
          runtime: python312
          service: brain-wire
          handlers:
            - url: /$
              static_files: static/index.html
              upload: static/index.html
              secure: always
              http_headers:
                X-Content-Type-Options: nosniff
                Referrer-Policy: strict-origin-when-cross-origin
                Permissions-Policy: "camera=(), microphone=(), geolocation=()"
                Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://connectome.quest"
            - url: /
              static_dir: static
              secure: always
              http_headers:
                X-Content-Type-Options: nosniff
                Referrer-Policy: strict-origin-when-cross-origin
                Permissions-Policy: "camera=(), microphone=(), geolocation=()"
                Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://connectome.quest"
          YAML
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/483670036293/locations/global/workloadIdentityPools/neuroglancer-github/providers/github
          service_account: chris-apps-deploy@seung-lab.iam.gserviceaccount.com
      - uses: google-github-actions/deploy-appengine@a343979004148afb93c94c712b467e8e9f01b06b # v2
        if: github.ref_name != 'codex/cleanup-repair-previews'
        with:
          version: ${{ env.APP_VERSION }}
          deliverables: site/app.yaml
          promote: false
      - name: Remove only merged repair previews with no routed traffic
        if: github.ref_name == 'codex/cleanup-repair-previews'
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const token=execFileSync('gcloud',['auth','print-access-token'],{encoding:'utf8'}).trim();
          const root='https://appengine.googleapis.com/v1/',base='apps/seung-lab/services/brain-wire';
          const api=async(path,method='GET')=>{const r=await fetch(root+path,{method,headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});const d=await r.json();if(!r.ok)throw Error(`${method} ${path}: ${r.status} ${d.error?.message||''}`);return d;};
          const allowed=new Set(['codex-restore-secure-automation','codex-complete-practice-fixtures','codex-secure-triage-restoration','codex-automation-verification','codex-automation-live-checks','codex-fix-practice-live-history']);
          const versions=[];let page='';
          do{const r=await api(base+'/versions?pageSize=100'+(page?'&pageToken='+encodeURIComponent(page):''));versions.push(...(r.versions||[]));page=r.nextPageToken||'';}while(page);
          console.log('Service versions before cleanup:',versions.length);
          let removed=0;
          for(const version of versions.filter(v=>allowed.has(v.id))) {
            if(!version.createTime?.startsWith('2026-09-27T'))throw Error('Unexpected creation date for '+version.id);
            const service=await api(base);
            if(Number(service.split?.allocations?.[version.id]||0)!==0)throw Error('Preview has routed traffic: '+version.id);
            const op=await api(base+'/versions/'+version.id,'DELETE');
            let result=op;
            for(let i=0;!result.done&&i<24;i++){await new Promise(r=>setTimeout(r,5000));result=await api(op.name);}
            if(!result.done||result.error)throw Error('Version deletion did not complete: '+version.id);
            console.log('Removed merged repair preview:',version.id);removed++;
          }
          console.log('Removed repair previews:',removed);
          JS
