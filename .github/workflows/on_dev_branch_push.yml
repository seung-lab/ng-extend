name: BuildAndDeployDevBranch
run-name: Deploy ${{ inputs.deployment_id || github.sha }}
on:
  push:
    branches-ignore: [master]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional exact commit to build using this trusted workflow
        type: string
        default: ''
      version:
        description: Target version for an exact-commit build
        type: string
        default: ''
      deployment_id:
        description: Correlation ID for automation
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate dispatch target
        env:
          SOURCE: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$SOURCE" ]; then
            [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$VERSION" =~ ^(eyewire-ii-community|triage-[0-9a-f]{8})$ ]] || exit 1
          elif [ -n "$VERSION" ]; then exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the current production commit for a production dispatch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$VERSION" = eyewire-ii-community ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/eyewire-ii-community)"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Security regression tests
        run: node --test scripts/security-regression.cjs
      - name: Verify pilot access and PostgreSQL transactions
        run: |
          npm ci --prefix functions
          node --test functions/*.test.js
      - name: Build client bundles
        run: node scripts/build-prod.js
      - name: Record the built commit
        run: git rev-parse HEAD > dist/min/build-commit.txt
      - name: Reject credential material in generated JavaScript
        run: |
          if grep -rlE 'BEGIN (RSA |EC )?PRIVATE KEY|sb_secret_' dist/min --include='*.js'; then
            echo 'Credential material detected in browser output' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ github.sha }}
          path: dist/min/
          if-no-files-found: error
          retention-days: 3
  deploy:
    concurrency:
      group: eyewire-deploy-${{ inputs.version || github.ref_name }}
      cancel-in-progress: false
    needs: build
    if: github.repository == 'seung-lab/ng-extend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, npm install, repository script or model runs with deploy identity.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-${{ github.sha }}
          path: site/static
      - name: Write fixed static hosting configuration
        shell: bash
        env:
          REF_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION=$(printf '%s' "$REF_NAME" | tr '/_' '--')
          [[ "$VERSION" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || exit 1
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cat > site/app.yaml <<'YAML'
          runtime: python312
          service: brain-wire
          handlers:
            - url: /$
              static_files: static/index.html
              upload: static/index.html
              secure: always
              http_headers:
                X-Content-Type-Options: nosniff
                Referrer-Policy: strict-origin-when-cross-origin
                Permissions-Policy: "camera=(), microphone=(), geolocation=()"
                Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://connectome.quest"
            - url: /
              static_dir: static
              secure: always
              http_headers:
                X-Content-Type-Options: nosniff
                Referrer-Policy: strict-origin-when-cross-origin
                Permissions-Policy: "camera=(), microphone=(), geolocation=()"
                Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://connectome.quest"
          YAML
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/483670036293/locations/global/workloadIdentityPools/neuroglancer-github/providers/github
          service_account: chris-apps-deploy@seung-lab.iam.gserviceaccount.com
      # App Engine allows 210 versions per app, and every pushed branch and
      # triage build adds one; at the cap every new preview is refused
      # ("may not have more than 210 versions", Ames 2026-09-30). Near the cap,
      # delete the oldest versions that serve no traffic, keeping about 110,
      # and never the live branch, this deploy's version, or anything serving.
      - name: Make room for this version (App Engine keeps at most 210)
        shell: bash
        run: |
          set -euo pipefail
          # The 210 cap counts EVERY service in the seung-lab app, not just
          # ours, so measure the whole app, but only ever delete brain-wire's
          # own idle previews (other services belong to other projects).
          gcloud app versions list --project=seung-lab --format='value(service)' > all.txt
          app_total=$(grep -c . all.txt || true)
          echo "seung-lab app has $app_total versions:"; sort all.txt | uniq -c | sort -rn | head -12
          gcloud app versions list --project=seung-lab --service=brain-wire \
            --format='value(id,traffic_split)' --sort-by='last_deployed_time' > versions.txt
          total=$(grep -c . versions.txt || true)
          echo "brain-wire has $total versions"
          if [ "$app_total" -lt 195 ]; then exit 0; fi
          # Free up to 30 slots, and always keep brain-wire's 15 newest.
          awk -v me="$APP_VERSION" \
            '$1 != "" && ($2 + 0) == 0 && $1 != me && $1 !~ /^(eyewire-ii-community|master|main)$/ {print $1}' versions.txt \
            | head -n $(( total > 15 ? total - 15 : 0 )) | head -n 30 > drop.txt
          echo "Deleting the $(grep -c . drop.txt || true) oldest idle versions"
          xargs -r -n 20 gcloud app versions delete --project=seung-lab --service=brain-wire --quiet < drop.txt
      - uses: google-github-actions/deploy-appengine@a343979004148afb93c94c712b467e8e9f01b06b # v2
        with:
          version: ${{ env.APP_VERSION }}
          deliverables: site/app.yaml
          promote: false
