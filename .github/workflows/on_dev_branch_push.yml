name: BuildAndDeployDevBranch
on:
  push:
    branches-ignore: [master]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Security regression tests
        run: node --test scripts/security-regression.cjs
      - name: Build client bundles
        run: node scripts/build-prod.js
      - name: Reject credential material in generated JavaScript
        run: |
          if grep -rlE 'BEGIN (RSA |EC )?PRIVATE KEY|sb_secret_' dist/min --include='*.js'; then
            echo 'Credential material detected in browser output' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ github.sha }}
          path: dist/min/
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: build
    if: github.repository == 'seung-lab/ng-extend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, npm install, repository script or model runs with deploy identity.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-${{ github.sha }}
          path: site/static
      - name: Write fixed static hosting configuration
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(printf '%s' "$REF_NAME" | tr '/_' '--')
          [[ "$VERSION" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || exit 1
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cat > site/app.yaml <<'YAML'
          runtime: python312
          service: brain-wire
          handlers:
            - url: /$
              static_files: static/index.html
              upload: static/index.html
              secure: always
              http_headers:
                X-Content-Type-Options: nosniff
                Referrer-Policy: strict-origin-when-cross-origin
                Permissions-Policy: "camera=(), microphone=(), geolocation=()"
                Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://connectome.quest"
            - url: /
              static_dir: static
              secure: always
              http_headers:
                X-Content-Type-Options: nosniff
                Referrer-Policy: strict-origin-when-cross-origin
                Permissions-Policy: "camera=(), microphone=(), geolocation=()"
                Content-Security-Policy: "object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://connectome.quest"
          YAML
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/483670036293/locations/global/workloadIdentityPools/neuroglancer-github/providers/github
          service_account: chris-apps-deploy@seung-lab.iam.gserviceaccount.com
      - uses: google-github-actions/deploy-appengine@a343979004148afb93c94c712b467e8e9f01b06b # v2
        with:
          version: ${{ env.APP_VERSION }}
          deliverables: site/app.yaml
          promote: false
