name: Slack Triage Bridge

# Posts new feedback_triage proposals to the feedback Slack channel, reads
# approver replies (approve / dismiss) back, mirrors Admin Hub decisions into
# Slack, and is the clock for the implement-on-approval loop: it starts
# triage-implement.yml / triage-deploy.yml and re-tags testers every 10
# minutes. See scripts/slack-triage-bridge.mjs and docs/TRIAGE-LOOP.md.
#
# SETUP (one-time):
#   1. Slack app with a bot token (xoxb-…), scopes: chat:write,
#      channels:history, channels:read. Invite the bot to the channel.
#   2. Repo secrets:    SLACK_BOT_TOKEN
#      Repo variables:  SLACK_CHANNEL_ID  (C…), APPROVER_SLACK_IDS
#                       (comma-separated member ids, e.g. U012AB,U034CD)
#   3. Apply supabase-triage-slack-columns.sql.
#   4. This file must ALSO exist on the default branch (main) for the cron
#      to fire. ⚠ Push it to main in a commit whose message contains
#      [skip ci] so the push does not trigger an App Engine deploy of a
#      main version (the deploy workflow ignores only 'master').
#
# The checkout below pins the branch so the script always runs from
# eyewire-ii-community regardless of which ref the workflow fired from.

on:
  schedule:
    # Every 10 minutes: testers are re-tagged on this clock until they reply.
    # GitHub may start a scheduled run a few minutes late under load.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Never two bridges at once: they would both nag and both dispatch.
concurrency:
  group: slack-triage-bridge
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # dispatch triage-implement.yml / triage-deploy.yml / triage-propose.yml

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eyewire-ii-community
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Post proposals + read approvals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Defaults discovered 2026-08-11: #citsci_feedback, approvers Amy
          # (U02FH1DRC) and Celia (U033NHWDE). Repo variables override.
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0BG5CN71C3' }}
          APPROVER_SLACK_IDS: ${{ vars.APPROVER_SLACK_IDS || 'U02FH1DRC,U033NHWDE' }}
          # The loop stays off until this repo variable is 'on' (after the
          # CLAUDE_CODE_OAUTH_TOKEN secret exists). Sync works without it.
          TRIAGE_LOOP: ${{ vars.TRIAGE_LOOP }}
          # Approvals before this time are backlog: shown in the Admin Hub with
          # a "Have Claude build it" button, never started automatically.
          TRIAGE_LOOP_SINCE: ${{ vars.TRIAGE_LOOP_SINCE }}
          # From this date Amy is tagged daily to renew the Claude token.
          CLAUDE_TOKEN_REMIND_AT: ${{ vars.CLAUDE_TOKEN_REMIND_AT }}
          APPROVER_NAME_MAP: ${{ vars.APPROVER_NAME_MAP }}
          GITHUB_TOKEN: ${{ github.token }}
          # Model credentials exist only in the isolated model jobs.
          TRIAGE_MODEL_CONFIGURED: 'true'
          GH_TOKEN: ${{ github.token }}
        # One run covers its 10 minute slot with a pass every 45 seconds, so an
        # approve gets its reply within a minute instead of waiting for the next
        # (often late) cron. Each pass also starts Triage Propose as soon as a
        # new report is waiting, unless a propose run is queued, running, or
        # started in the last 10 minutes (so a failing model is not hammered).
        run: |
          end=$((SECONDS + 540)); pass=0
          while :; do
            pass=$((pass + 1))
            BRIDGE_PASS=$pass node scripts/slack-triage-bridge.mjs || echo "::warning::bridge pass $pass failed"
            pending=$(GITHUB_OUTPUT= node scripts/triage-loop.mjs pending 2>/dev/null)
            count=$(printf '%s\n' "$pending" | sed -n 's/^count=//p')
            newest=$(printf '%s\n' "$pending" | sed -n 's/^newest=//p')
            if [ "${count:-0}" != "0" ]; then
              # Hold back only when a run is already going, or when the last
              # one started AFTER the newest waiting report arrived and less
              # than 10 minutes ago (it had its chance; do not loop on a
              # failure). A run that started before the report came in could
              # not have seen it, so it must not delay this one (2026-10-06:
              # a report waited 8 minutes behind an empty scheduled run).
              last=$(gh run list -R "$GITHUB_REPOSITORY" -w triage-propose.yml -L 1 --json status,createdAt -q '.[] | "\(.status) \(.createdAt | fromdateiso8601)"')
              status=${last%% *}; started=${last##* }
              arrived=$(date -u -d "${newest:-1970-01-01}" +%s 2>/dev/null || echo 0)
              recent=""
              if [ -n "$status" ] && [ "$status" != "completed" ]; then recent=running
              elif [ -n "$started" ] && [ $(( $(date -u +%s) - started )) -lt 600 ] && [ "$started" -gt $(( arrived + 5 )) ]; then recent=tried
              fi
              if [ -z "$recent" ]; then
                echo "[bridge] $count new report(s): starting Triage Propose"
                gh workflow run triage-propose.yml -R "$GITHUB_REPOSITORY" --ref main || echo "::warning::could not start Triage Propose"
              fi
            fi
            [ "$SECONDS" -ge "$end" ] && break
            sleep 45
          done
          # GitHub starts scheduled runs late, or skips them (2026-10-07: no
          # run for 28 minutes, and an approve sat unanswered). So each run
          # starts the next one itself as it finishes, and the bridge is always
          # listening. The cron above only restarts the chain if it ever
          # breaks. Still one run at a time (the concurrency group).
          gh workflow run slack-triage-bridge.yml -R "$GITHUB_REPOSITORY" --ref main || echo "::warning::could not start the next bridge run"
