name: Weekly Recap Notifications

on:
  schedule:
    # Every Saturday at 11pm UTC (6pm ET, 3pm PT)
    - cron: '0 23 * * 6'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send weekly recap notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/weekly-recap.mjs
