name: Weekly Recap Notifications

on:
  schedule:
    # Every Saturday at 11pm UTC (6pm ET, 3pm PT)
    # Sunday 23:00 UTC (7 pm Eastern in summer), after the Monday to Sunday
    # week it reports on is (nearly) over. It used to run Saturday.
    - cron: '0 23 * * 0'
  workflow_dispatch: # Allow manual trigger
    inputs:
      correct:
        description: Correct this week's recaps already sent, in place
        type: boolean
        default: false
      dry_run:
        description: Print what would be sent or corrected, change nothing
        type: boolean
        default: false

jobs:
  send-recap:
    runs-on: ubuntu-latest
    steps:
      # Cron workflows run from main, whose copy of the script is old: it sent
      # a second recap with different numbers. Always run the maintained one.
      - uses: actions/checkout@v4
        with:
          ref: eyewire-ii-community
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send weekly recap notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RECAP_CORRECT: ${{ inputs.correct }}
          RECAP_DRY: ${{ inputs.dry_run }}
        run: node scripts/weekly-recap.mjs
