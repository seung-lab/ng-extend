name: Tutorial Practice Reset

# Puts Cut & Merge practice cells back to their registered state after a
# user's claim expired or the in-browser undo failed. See
# scripts/reset-practice-examples.mjs and supabase-tutorial-practice-schema.sql.
#
# NOTE ON REGISTRATION: schedule and workflow_dispatch only register from the
# default branch, the same constraint as cave-edits-sync.yml. Until this file
# is on the default branch, run it by hand:
#   node scripts/reset-practice-examples.mjs
# with SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and CAVE_SERVICE_TOKEN set.

on:
  schedule:
    # Every 10 minutes: a practice cell is out of service between an abandoned
    # session and this run, and there are only a few of them.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'Optional: reset this one example (uuid), whatever its status'
        required: false
        default: ''
      dry_run:
        description: 'If "true", list what would be undone without touching CAVE or Supabase'
        required: false
        default: 'false'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reset practice cells
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAVE_SERVICE_TOKEN: ${{ secrets.CAVE_SERVICE_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.id }}" ]; then
            ARGS="$ARGS --id ${{ inputs.id }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/reset-practice-examples.mjs $ARGS
