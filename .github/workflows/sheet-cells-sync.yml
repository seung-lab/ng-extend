name: Sheet Cells Sync
on:
  schedule:
    - cron: '0 4,5 * * *'
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset to import (blank imports both registered sheets)
        type: choice
        options: ['', pinky_nf_v2, stroeh_mouse_retina]
        default: ''
      dry_run:
        description: Report new cells without writing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sheet-cells-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eyewire-ii-community
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Import new cells without changing existing tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATASET: ${{ inputs.dataset }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT" = workflow_dispatch ]; then args+=(--force); fi
          if [ -n "$DATASET" ]; then args+=(--dataset "$DATASET"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/sync-sheet-cells.mjs "${args[@]}"
