name: Triage Implement

# Claude works on one approved feedback_triage row. Dispatched by the Slack
# Triage Bridge; see docs/TRIAGE-LOOP.md. Runs on Amy's Princeton Claude
# subscription (secret CLAUDE_CODE_OAUTH_TOKEN, made with `claude
# setup-token` while signed in as amylr@princeton.edu).
#
#   mode=build   implement on triage/<id8>, deploy that branch as a preview,
#                tag the tester. Or stop with a QUESTION / BLOCKED.
#   mode=answer  answer the tester's question about the build; no changes.
#
# This file must ALSO exist on main for workflow_dispatch to work. Register
# it there in a commit whose message contains [skip ci].

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: feedback_triage row id
        required: true
        type: string
      mode:
        description: build or answer
        required: false
        default: build
        type: string

concurrency:
  group: triage-impl-${{ inputs.row_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      ROW_ID: ${{ inputs.row_id }}
      TRIAGE_MODE: ${{ inputs.mode }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0BG5CN71C3' }}
      APPROVER_SLACK_IDS: ${{ vars.APPROVER_SLACK_IDS || 'U02FH1DRC,U033NHWDE' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # No persisted credentials: Claude's session cannot push anything. The
      # publish step below pushes the one branch, with the token, itself.
      - uses: actions/checkout@v4
        with:
          ref: eyewire-ii-community
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare prompt and branch
        id: prep
        run: node scripts/triage-loop.mjs prepare

      - name: Check out the triage branch
        run: |
          B='${{ steps.prep.outputs.branch }}'
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then
            git fetch origin "$B"
            git checkout -B "$B" "origin/$B"
            if [ "$TRIAGE_MODE" = build ]; then
              # Pick up anything that landed on the base since the last attempt.
              git -c user.name=ci -c user.email=ci@localhost merge --no-edit origin/eyewire-ii-community
            fi
          else
            git checkout -b "$B"
          fi

      - name: Install dependencies
        if: inputs.mode != 'answer'
        run: npm install

      - name: Claude builds it
        if: inputs.mode != 'answer'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Fallback until the Princeton token is in: an Anthropic API key
          # (billed per use). The token wins whenever it is set.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # The bridge (github-actions) starts these runs; the action refuses
          # bot-started runs unless the bot is listed.
          allowed_bots: github-actions
          github_token: ${{ github.token }}
          # The spec lives in a file so no user text passes through YAML.
          prompt: Read ${{ steps.prep.outputs.prompt_file }} and do exactly what it says.
          # Temporary while the first real builds are checked: log every step.
          show_full_output: true
          claude_args: >-
            --model opus
            --permission-mode acceptEdits
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node scripts/build-prod.js),Bash(npm run typecheck),Bash(git diff:*),Bash(git status:*),Bash(git log:*)"

      - name: Claude answers the question
        if: inputs.mode == 'answer'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Fallback until the Princeton token is in: an Anthropic API key
          # (billed per use). The token wins whenever it is set.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # The bridge (github-actions) starts these runs; the action refuses
          # bot-started runs unless the bot is listed.
          allowed_bots: github-actions
          github_token: ${{ github.token }}
          prompt: Read ${{ steps.prep.outputs.prompt_file }} and do exactly what it says.
          claude_args: >-
            --model opus
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*)"

      - name: Post the answer
        if: inputs.mode == 'answer'
        run: node scripts/triage-loop.mjs answered

      - name: Commit and push the branch
        id: publish
        if: inputs.mode != 'answer'
        run: |
          S='${{ steps.prep.outputs.summary_file }}'
          if [ -f "$S" ] && head -1 "$S" | grep -qiE '^#* *(BLOCKED|QUESTION)'; then
            node scripts/triage-loop.mjs blocked
            echo "stopped=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git add -A -- . ':!node_modules' ':!dist' ':!appengine/frontend/static' ':!.triage'
          if git diff --cached --quiet; then
            echo "Claude made no changes and did not say BLOCKED or QUESTION" >&2; exit 1
          fi
          TITLE=$( [ -f "$S" ] && head -1 "$S" | sed 's/^#* *//' || echo "approved triage change" )
          git -c user.name="Claude (triage)" -c user.email="noreply@anthropic.com" commit -q \
            -m "Triage ${ROW_ID:0:8}: $TITLE" \
            -m "Approved feedback_triage row $ROW_ID, attempt ${{ steps.prep.outputs.attempt }}. $RUN_URL" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${{ steps.prep.outputs.branch }}"

      # A push made with GITHUB_TOKEN does not fire on_dev_branch_push, so the
      # preview deploy is started explicitly and watched to the end.
      - name: Deploy the preview
        if: inputs.mode != 'answer' && steps.publish.outputs.stopped != 'true'
        run: |
          B='${{ steps.prep.outputs.branch }}'
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run on_dev_branch_push.yml --ref "$B"
          for i in $(seq 1 30); do
            ID=$(gh run list --workflow on_dev_branch_push.yml --branch "$B" --event workflow_dispatch -L 1 \
                 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$SINCE\") | .databaseId")
            [ -n "$ID" ] && break; sleep 5
          done
          [ -n "$ID" ] || { echo "preview deploy run never appeared" >&2; exit 1; }
          gh run watch "$ID" --exit-status --interval 20

      - name: Tag the tester
        if: inputs.mode != 'answer' && steps.publish.outputs.stopped != 'true'
        run: node scripts/triage-loop.mjs ready

      - name: Report failure
        if: failure()
        run: node scripts/triage-loop.mjs fail "${{ inputs.mode == 'answer' && 'answer' || 'implementation' }}"
