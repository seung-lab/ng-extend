name: Triage Deploy
on:
  workflow_dispatch:
    inputs:
      row_id:
        description: Approved feedback triage UUID
        required: true
        type: string
      mode:
        description: Release the approved commit or revert its live test
        type: choice
        options: [final, live_test, revert]
        default: final
permissions:
  contents: read
concurrency:
  group: triage-deploy
  cancel-in-progress: false
env:
  ROW_ID: ${{ inputs.row_id }}
  TRIAGE_MODE: ${{ inputs.mode }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eyewire-ii-community
          persist-credentials: false
      - name: Independently verify the tester, preview and exact commit
        id: release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0BG5CN71C3' }}
          APPROVER_SLACK_IDS: ${{ vars.APPROVER_SLACK_IDS || 'U02FH1DRC,U033NHWDE' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/triage-secure.mjs release
      - name: Record verified deployment
        env:
          NEXT: ${{ steps.release.outputs.next }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0BG5CN71C3' }}
          APPROVER_SLACK_IDS: ${{ vars.APPROVER_SLACK_IDS || 'U02FH1DRC,U033NHWDE' }}
        run: |
          case "$NEXT" in live|deployed|reverted) node scripts/triage-loop.mjs "$NEXT";; stale) echo 'Rebuilding on the changed base before requesting fresh approval.';; *) exit 1;; esac
      - name: Report release failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0BG5CN71C3' }}
          APPROVER_SLACK_IDS: ${{ vars.APPROVER_SLACK_IDS || 'U02FH1DRC,U033NHWDE' }}
        run: node scripts/triage-loop.mjs fail deploy
