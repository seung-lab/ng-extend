name: Triage Deploy
# Security containment: enabling the registered workflow must not restore
# secret-bearing model execution or approval inferred from Slack prose.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  security-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Require the reviewed replacement workflow
        run: |
          echo "Automated triage is paused. Use a reviewed pull request for changes."
          echo "See docs/SECURITY-REMEDIATION.md for re-enablement requirements."
          exit 1
