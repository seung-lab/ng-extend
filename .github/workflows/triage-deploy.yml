name: Triage Deploy

# Puts a tested triage/<id8> branch on the live community site, or takes it
# off again. Dispatched by the Slack Triage Bridge; see docs/TRIAGE-LOOP.md.
#
#   mode=final      tester replied "good": merge, deploy, close the row
#   mode=live_test  tester replied "ship to test": merge and deploy so they
#                   can test on the live site; they still reply good/revert
#   mode=revert     undo that merge on the live site, and keep the change
#                   on the triage branch so Claude can fix it and re-merge
#
# This file must ALSO exist on main for workflow_dispatch to work. Register
# it there in a commit whose message contains [skip ci].

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: feedback_triage row id
        required: true
        type: string
      mode:
        description: final, live_test or revert
        required: false
        default: final
        type: string

# One live change at a time; a second "good" waits its turn.
concurrency:
  group: triage-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ROW_ID: ${{ inputs.row_id }}
      MODE: ${{ inputs.mode }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0BG5CN71C3' }}
      APPROVER_SLACK_IDS: ${{ vars.APPROVER_SLACK_IDS || 'U02FH1DRC,U033NHWDE' }}
      GH_TOKEN: ${{ github.token }}
      BASE: eyewire-ii-community
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eyewire-ii-community
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the tested branch
        if: inputs.mode != 'revert'
        run: |
          B="triage/${ROW_ID:0:8}"
          git fetch origin "$B"
          LABEL=$([ "$MODE" = live_test ] && echo "live test" || echo "tested and approved in Slack")
          git -c user.name="Claude (triage)" -c user.email="noreply@anthropic.com" \
            merge --no-ff "origin/$B" -m "Merge $B: $LABEL ($RUN_URL)"
          # The release note links to the merge, which shows the whole change.
          echo "MERGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BASE"

      - name: Revert the live merge
        if: inputs.mode == 'revert'
        run: |
          B="triage/${ROW_ID:0:8}"
          PUSH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          M=$(git log --merges -1 --format=%H --grep="^Merge $B:" HEAD)
          [ -n "$M" ] || { echo "no merge of $B found on $BASE" >&2; exit 1; }
          git -c user.name="Claude (triage)" -c user.email="noreply@anthropic.com" \
            revert --no-edit -m 1 "$M"
          R=$(git rev-parse HEAD)
          git push "$PUSH" "HEAD:refs/heads/$BASE"
          # Git would treat the reverted commits as already merged and never
          # bring them back. Put the change back on the triage branch (revert
          # the revert there), so Claude's fix and the next merge carry it.
          git fetch origin "$B"
          git checkout -B "$B" "origin/$B"
          git -c user.name="Claude (triage)" -c user.email="noreply@anthropic.com" merge --no-edit "origin/$BASE"
          git -c user.name="Claude (triage)" -c user.email="noreply@anthropic.com" revert --no-edit "$R"
          git push "$PUSH" "HEAD:refs/heads/$B"
          git checkout "$BASE"

      - name: Deploy the live community version
        run: |
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run on_dev_branch_push.yml --ref "$BASE"
          for i in $(seq 1 30); do
            ID=$(gh run list --workflow on_dev_branch_push.yml --branch "$BASE" --event workflow_dispatch -L 1 \
                 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$SINCE\") | .databaseId")
            [ -n "$ID" ] && break; sleep 5
          done
          [ -n "$ID" ] || { echo "deploy run never appeared" >&2; exit 1; }
          gh run watch "$ID" --exit-status --interval 20

      - name: Verify the live site answers
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://eyewire-ii-community-dot-brain-wire-dot-seung-lab.ue.r.appspot.com/)
            [ "$code" = 200 ] && exit 0; sleep 15
          done
          echo "live site did not return 200" >&2; exit 1

      - name: Update the row
        run: |
          case "$MODE" in
            live_test) node scripts/triage-loop.mjs live ;;
            revert)    node scripts/triage-loop.mjs reverted ;;
            *)         node scripts/triage-loop.mjs deployed ;;
          esac

      - name: Report failure
        if: failure()
        run: node scripts/triage-loop.mjs fail "${{ inputs.mode == 'revert' && 'revert' || 'deploy' }}"
